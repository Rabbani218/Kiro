<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* =====================================================
       RESET & BASE
    ===================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #1a1d23;
      transition: background 0.4s;
    }
    [data-theme="dark"] body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }
    ul { list-style: none; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input { font-family: inherit; }

    /* =====================================================
       LAYOUT WRAPPER
    ===================================================== */
    .page-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 28px 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* =====================================================
       CARDS
    ===================================================== */
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 28px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }
    [data-theme="dark"] .card {
      background: #1e2035;
      color: #e8eaf2;
      box-shadow: 0 8px 32px rgba(0,0,0,0.40);
    }

    /* =====================================================
       TOP BAR
    ===================================================== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 4px;
    }
    .topbar__logo {
      font-size: 1rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      letter-spacing: -0.01em;
    }
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .theme-toggle__label {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.8);
      font-weight: 500;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch__slider {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.3);
      border-radius: 9999px;
      transition: background 0.25s;
      cursor: pointer;
    }
    .switch__slider::before {
      content: '';
      position: absolute;
      left: 3px; top: 3px;
      width: 18px; height: 18px;
      background: white;
      border-radius: 50%;
      transition: transform 0.25s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .switch input:checked + .switch__slider { background: rgba(255,255,255,0.55); }
    .switch input:checked + .switch__slider::before { transform: translateX(20px); }

    /* =====================================================
       HERO CARD — Clock + Greeting
    ===================================================== */
    .card--hero {
      text-align: center;
      padding: 36px 32px 32px;
      position: relative;
    }
    .hero__time {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: #5b6ef5;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    [data-theme="dark"] .hero__time { color: #818cf8; }
    .hero__date {
      font-size: 0.95rem;
      color: #8a90a0;
      margin-top: 6px;
      margin-bottom: 14px;
    }
    [data-theme="dark"] .hero__date { color: #9aa0b8; }
    .hero__greeting {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1d23;
      letter-spacing: -0.02em;
    }
    [data-theme="dark"] .hero__greeting { color: #e8eaf2; }
    /* Name edit row */
    .hero__name-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .hero__name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #5b6ef5;
    }
    [data-theme="dark"] .hero__name { color: #818cf8; }
    .btn-edit-name {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: #f0f2ff;
      color: #5b6ef5;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px;
      transition: background 0.15s;
    }
    .btn-edit-name:hover { background: #e0e4ff; }
    [data-theme="dark"] .btn-edit-name { background: #2a2d50; color: #818cf8; }
    .name-editor {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .name-editor.open { display: flex; }
    .name-editor__input {
      padding: 8px 14px;
      border: 1.5px solid #c7cdf7;
      border-radius: 8px;
      font-size: 0.9rem;
      width: 200px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #f7f8ff;
      color: #1a1d23;
    }
    .name-editor__input:focus { border-color: #5b6ef5; box-shadow: 0 0 0 3px rgba(91,110,245,0.15); }
    [data-theme="dark"] .name-editor__input { background: #2a2d50; border-color: #3d4080; color: #e8eaf2; }

    /* =====================================================
       GRID ROW (Timer + Todo side by side)
    ===================================================== */
    .dashboard__row {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 20px;
      align-items: start;
    }

    /* =====================================================
       FOCUS TIMER CARD
    ===================================================== */
    .card--timer { text-align: center; }
    .card__title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #1a1d23;
    }
    [data-theme="dark"] .card__title { color: #e8eaf2; }
    .timer__display {
      font-size: 4rem;
      font-weight: 800;
      color: #5b6ef5;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      margin: 8px 0 6px;
      line-height: 1;
      transition: color 0.3s;
    }
    [data-theme="dark"] .timer__display { color: #818cf8; }
    .timer__display.warning { color: #f59e0b; }
    .timer__display.urgent  { color: #ef4444; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    .timer__progress-track {
      width: 100%;
      height: 5px;
      background: #e8eaf2;
      border-radius: 9999px;
      overflow: hidden;
      margin: 12px 0 20px;
    }
    [data-theme="dark"] .timer__progress-track { background: #2e3248; }
    .timer__progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #5b6ef5, #a78bfa);
      border-radius: 9999px;
      transition: width 1s linear;
    }
    .timer__controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .timer__status {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #9aa0ab;
      min-height: 1.2em;
    }

    /* =====================================================
       TO-DO CARD
    ===================================================== */
    .todo__input-row { display: flex; gap: 8px; margin-bottom: 6px; }
    .todo__input-row .input { flex: 1; }
    .todo__error {
      font-size: 0.75rem;
      color: #ef4444;
      min-height: 1.1em;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .todo__filters {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      background: #f4f5fb;
      border-radius: 10px;
      padding: 4px;
    }
    [data-theme="dark"] .todo__filters { background: #252840; }
    .filter-tab {
      flex: 1;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #7a8090;
      transition: background 0.15s, color 0.15s;
    }
    .filter-tab.active {
      background: #fff;
      color: #5b6ef5;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    [data-theme="dark"] .filter-tab.active { background: #1e2035; color: #818cf8; }
    .todo__list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 12px;
      scrollbar-width: thin;
      scrollbar-color: #e0e4ff transparent;
    }
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #f7f8ff;
      border: 1.5px solid #e8eaf5;
      border-radius: 10px;
      transition: border-color 0.15s, background 0.15s, opacity 0.3s, transform 0.3s;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:translateY(0)} }
    [data-theme="dark"] .task-item { background: #252840; border-color: #2e3258; }
    .task-item:hover { border-color: #5b6ef5; }
    .task-item.completed { opacity: 0.5; background: #f0fdf4; border-color: transparent; }
    [data-theme="dark"] .task-item.completed { background: #1a2a1e; }
    .task-item.removing { opacity: 0; transform: translateX(14px); }
    /* Custom checkbox */
    .task-item__check {
      appearance: none;
      width: 18px; height: 18px;
      border: 2px solid #c7cdf7;
      border-radius: 5px;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
    }
    .task-item__check:checked { background: #5b6ef5; border-color: #5b6ef5; }
    .task-item__check:checked::after {
      content: '';
      position: absolute;
      left: 3px; top: 0px;
      width: 6px; height: 10px;
      border: 2px solid white;
      border-top: none; border-left: none;
      transform: rotate(45deg);
    }
    .task-item__text {
      flex: 1;
      font-size: 0.875rem;
      color: #1a1d23;
      word-break: break-word;
      line-height: 1.4;
    }
    [data-theme="dark"] .task-item__text { color: #e0e2f0; }
    .task-item.completed .task-item__text {
      text-decoration: line-through;
      color: #9aa0ab;
    }
    .task-item__edit-input {
      flex: 1;
      font-size: 0.875rem;
      padding: 4px 8px;
      border: 1.5px solid #5b6ef5;
      border-radius: 6px;
      outline: none;
      background: white;
      color: #1a1d23;
      box-shadow: 0 0 0 3px rgba(91,110,245,0.15);
    }
    [data-theme="dark"] .task-item__edit-input { background: #1e2035; color: #e8eaf2; }
    .task-item__actions { display: flex; gap: 4px; flex-shrink: 0; }
    .task-item__btn {
      width: 26px; height: 26px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      color: #9aa0ab;
      transition: background 0.15s, color 0.15s;
    }
    .task-item__btn:hover { background: #f0f2ff; color: #5b6ef5; }
    .task-item__btn--delete:hover { background: #fff0f0; color: #ef4444; }
    .todo__empty {
      text-align: center;
      font-size: 0.85rem;
      color: #9aa0ab;
      padding: 20px 0;
      display: none;
    }
    .todo__empty.visible { display: block; }
    .todo__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .todo__count { font-size: 0.75rem; color: #9aa0ab; }

    /* =====================================================
       QUICK LINKS CARD
    ===================================================== */
    .links__form { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .links__form .input { flex: 1; min-width: 120px; }
    .links__error {
      font-size: 0.75rem;
      color: #ef4444;
      min-height: 1.1em;
      margin-bottom: 12px;
      font-weight: 500;
    }
    .links__grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .link-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #5b6ef5;
      color: white;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(91,110,245,0.30);
      position: relative;
      animation: fadeIn 0.2s ease;
    }
    .link-chip:hover { background: #4a5de0; transform: translateY(-2px); box-shadow: 0 4px 14px rgba(91,110,245,0.40); }
    .link-chip__favicon {
      width: 16px; height: 16px;
      border-radius: 3px;
      object-fit: contain;
    }
    .link-chip__delete {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      font-weight: 700;
      transition: background 0.15s;
      flex-shrink: 0;
      cursor: pointer;
      border: none;
    }
    .link-chip__delete:hover { background: rgba(255,255,255,0.45); }
    .links__empty {
      font-size: 0.85rem;
      color: #9aa0ab;
      padding: 12px 0;
      display: none;
    }
    .links__empty.visible { display: block; }

    /* =====================================================
       SHARED: INPUT + BUTTONS
    ===================================================== */
    .input {
      padding: 9px 14px;
      border: 1.5px solid #e2e6ea;
      border-radius: 9px;
      background: #f7f8ff;
      color: #1a1d23;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input::placeholder { color: #b0b6c4; }
    .input:focus { border-color: #5b6ef5; box-shadow: 0 0 0 3px rgba(91,110,245,0.15); background: white; }
    [data-theme="dark"] .input { background: #252840; border-color: #2e3258; color: #e8eaf2; }
    [data-theme="dark"] .input:focus { background: #2e3258; border-color: #818cf8; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 20px;
      border-radius: 9px;
      font-size: 0.875rem;
      font-weight: 600;
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s, opacity 0.15s;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      border: none;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn--primary { background: #5b6ef5; color: white; box-shadow: 0 2px 8px rgba(91,110,245,0.30); }
    .btn--primary:hover:not(:disabled) { background: #4a5de0; box-shadow: 0 4px 14px rgba(91,110,245,0.40); }

    .btn--secondary { background: #f0f2ff; color: #5b6ef5; }
    .btn--secondary:hover:not(:disabled) { background: #e0e4ff; }
    [data-theme="dark"] .btn--secondary { background: #252840; color: #818cf8; }

    .btn--danger { background: #ef4444; color: white; box-shadow: 0 2px 8px rgba(239,68,68,0.25); }
    .btn--danger:hover:not(:disabled) { background: #dc2626; }

    .btn--ghost { background: transparent; color: #7a8090; border: 1.5px solid #e2e6ea; }
    .btn--ghost:hover:not(:disabled) { background: #f4f5fb; color: #1a1d23; }
    [data-theme="dark"] .btn--ghost { border-color: #2e3258; color: #9aa0b8; }
    [data-theme="dark"] .btn--ghost:hover:not(:disabled) { background: #252840; color: #e8eaf2; }

    .btn--sm { padding: 6px 12px; font-size: 0.78rem; border-radius: 7px; }

    /* =====================================================
       TOAST
    ===================================================== */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1a1d23;
      color: white;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.20);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* =====================================================
       RESPONSIVE
    ===================================================== */
    @media (max-width: 720px) {
      .dashboard__row { grid-template-columns: 1fr; }
      .hero__time { font-size: 3rem; }
      .timer__display { font-size: 3rem; }
      .page-wrapper { padding: 20px 14px 36px; }
      .card { padding: 22px 20px; }
    }
    @media (max-width: 440px) {
      .hero__time { font-size: 2.4rem; }
      .timer__display { font-size: 2.6rem; }
      .links__form { flex-direction: column; }
      .todo__input-row { flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
    }
  </style>
</head>
<body>

<div class="page-wrapper">

  <!-- ── TOP BAR ── -->
  <div class="topbar">
    <span class="topbar__logo">⊙ Life Dashboard</span>
    <div class="theme-toggle">
      <span class="theme-toggle__label">☀️</span>
      <label class="switch" aria-label="Toggle dark mode">
        <input type="checkbox" id="themeToggle" />
        <span class="switch__slider"></span>
      </label>
      <span class="theme-toggle__label">🌙</span>
    </div>
  </div>

  <!-- ── HERO: Clock + Greeting ── -->
  <div class="card card--hero">
    <p id="clock" class="hero__time">12:00:00 AM</p>
    <p id="dateDisplay" class="hero__date">Loading…</p>
    <p class="hero__greeting" id="greetingText">Good Morning,</p>
    <div class="hero__name-row">
      <span class="hero__name" id="greetingName">Friend</span>
      <button class="btn-edit-name" id="editNameBtn" title="Edit name" aria-label="Edit name">✏️</button>
    </div>
    <!-- Name editor -->
    <div class="name-editor" id="nameEditor">
      <input type="text" id="nameInput" class="name-editor__input" placeholder="Enter your name…" maxlength="30" aria-label="Your name" />
      <button class="btn btn--primary btn--sm" id="saveNameBtn">Save</button>
      <button class="btn btn--ghost btn--sm" id="cancelNameBtn">Cancel</button>
    </div>
  </div>

  <!-- ── MAIN ROW: Timer + Todo ── -->
  <div class="dashboard__row">

    <!-- Focus Timer -->
    <div class="card card--timer">
      <p class="card__title">⏱ Focus Timer</p>
      <div class="timer__display" id="timerDisplay">25:00</div>
      <div class="timer__progress-track">
        <div class="timer__progress-fill" id="timerFill" style="width:100%"></div>
      </div>
      <div class="timer__controls">
        <button class="btn btn--primary" id="timerStart">▶ Start</button>
        <button class="btn btn--secondary" id="timerStop" disabled>⏸ Stop</button>
        <button class="btn btn--ghost" id="timerReset">↺ Reset</button>
      </div>
      <p class="timer__status" id="timerStatus">Ready to focus</p>
    </div>

    <!-- To-Do List -->
    <div class="card">
      <p class="card__title">✅ Tasks</p>

      <div class="todo__input-row">
        <input type="text" id="taskInput" class="input" placeholder="Add a new task…" maxlength="120" aria-label="New task" />
        <button class="btn btn--primary" id="addTaskBtn">Add</button>
      </div>
      <p class="todo__error" id="taskError"></p>

      <div class="todo__filters" role="tablist">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="active">Active</button>
        <button class="filter-tab" data-filter="completed">Done</button>
      </div>

      <ul class="todo__list" id="taskList" aria-label="Task list"></ul>
      <p class="todo__empty" id="taskEmpty">No tasks yet — add one above!</p>

      <div class="todo__footer">
        <span class="todo__count" id="taskCount"></span>
        <button class="btn btn--ghost btn--sm" id="clearDoneBtn">Clear completed</button>
      </div>
    </div>

  </div><!-- /.dashboard__row -->

  <!-- ── QUICK LINKS ── -->
  <div class="card">
    <p class="card__title">🔗 Quick Links</p>
    <form class="links__form" id="addLinkForm" novalidate>
      <input type="text" id="linkName" class="input" placeholder="Link name" maxlength="40" aria-label="Link name" />
      <input type="url" id="linkUrl"  class="input" placeholder="URL (https://…)" maxlength="300" aria-label="Link URL" />
      <button type="submit" class="btn btn--primary">Add Link</button>
    </form>
    <p class="links__error" id="linkError"></p>
    <div class="links__grid" id="linksGrid"></div>
    <p class="links__empty visible" id="linksEmpty">No links yet — add your favourites above!</p>
  </div>

</div><!-- /.page-wrapper -->

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   LIFE DASHBOARD — Vanilla JS
   All modules: Theme, Clock, Name, Timer, Todo, Links, Toast
============================================================ */
'use strict';

/* ── Storage helpers ── */
const Store = {
  get(k, d=null){ try{ const v=localStorage.getItem(k); return v!==null?JSON.parse(v):d; }catch{ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ console.warn(e); } }
};
const K = { THEME:'ld_theme', NAME:'ld_name', TASKS:'ld_tasks', LINKS:'ld_links' };

/* ── Toast ── */
const Toast = (()=>{
  const el = document.getElementById('toast');
  let t = null;
  function show(msg, ms=2800){
    if(!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(t);
    t = setTimeout(()=>el.classList.remove('show'), ms);
  }
  return { show };
})();

/* ── Theme ── */
(()=>{
  const toggle = document.getElementById('themeToggle');
  const html   = document.documentElement;
  function apply(theme){
    html.setAttribute('data-theme', theme);
    if(toggle) toggle.checked = (theme==='dark');
  }
  apply(Store.get(K.THEME,'light'));
  toggle && toggle.addEventListener('change',()=>{
    const next = toggle.checked ? 'dark' : 'light';
    apply(next);
    Store.set(K.THEME, next);
    Toast.show(`${next==='dark'?'🌙 Dark':'☀️ Light'} mode on`);
  });
})();

/* ── Clock & Greeting ── */
(()=>{
  const clockEl    = document.getElementById('clock');
  const dateEl     = document.getElementById('dateDisplay');
  const greetEl    = document.getElementById('greetingText');
  const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const pad = n => String(n).padStart(2,'0');
  function getGreeting(h){ return h<12?'Good Morning,':h<18?'Good Afternoon,':'Good Evening,'; }
  function tick(){
    const now=new Date(), h=now.getHours(), m=now.getMinutes(), s=now.getSeconds();
    const ampm=h>=12?'PM':'AM', h12=h%12||12;
    if(clockEl) clockEl.textContent=`${pad(h12)}:${pad(m)}:${pad(s)} ${ampm}`;
    if(greetEl) greetEl.textContent=getGreeting(h);
    if(dateEl)  dateEl.textContent=`${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
  }
  tick(); setInterval(tick,1000);
})();

/* ── Custom Name ── */
(()=>{
  const nameDisplay = document.getElementById('greetingName');
  const editBtn     = document.getElementById('editNameBtn');
  const editor      = document.getElementById('nameEditor');
  const nameInput   = document.getElementById('nameInput');
  const saveBtn     = document.getElementById('saveNameBtn');
  const cancelBtn   = document.getElementById('cancelNameBtn');
  let current = Store.get(K.NAME,'Friend');
  function render(){ if(nameDisplay) nameDisplay.textContent=current; }
  function open(){ editor.classList.add('open'); nameInput.value=current==='Friend'?'':current; nameInput.focus(); }
  function close(){ editor.classList.remove('open'); }
  function save(){
    const v=nameInput.value.trim(); const name=v||'Friend';
    current=name; Store.set(K.NAME,name); render(); close();
    Toast.show(`Hello, ${name}! 👋`);
  }
  render();
  editBtn   && editBtn.addEventListener('click', open);
  saveBtn   && saveBtn.addEventListener('click', save);
  cancelBtn && cancelBtn.addEventListener('click', close);
  nameInput && nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter')save(); if(e.key==='Escape')close(); });
})();

/* ── Focus Timer ── */
(()=>{
  const TOTAL = 25*60;
  const dispEl   = document.getElementById('timerDisplay');
  const fillEl   = document.getElementById('timerFill');
  const statusEl = document.getElementById('timerStatus');
  const startBtn = document.getElementById('timerStart');
  const stopBtn  = document.getElementById('timerStop');
  const resetBtn = document.getElementById('timerReset');
  let remaining=TOTAL, interval=null, running=false;
  const pad=n=>String(n).padStart(2,'0');
  function render(){
    const m=Math.floor(remaining/60), s=remaining%60;
    if(dispEl){ dispEl.textContent=`${pad(m)}:${pad(s)}`; }
    if(fillEl) fillEl.style.width=`${(remaining/TOTAL)*100}%`;
    // colour urgency
    if(dispEl){
      dispEl.classList.toggle('warning', remaining<=300 && remaining>60);
      dispEl.classList.toggle('urgent',  remaining<=60  && remaining>0);
    }
  }
  function setStatus(msg){ if(statusEl) statusEl.textContent=msg; }
  function setBtns(r){ if(startBtn)startBtn.disabled=r; if(stopBtn)stopBtn.disabled=!r; }
  function start(){
    if(running||remaining<=0) return;
    running=true; setBtns(true); setStatus('Stay focused — you got this! 🎯');
    interval=setInterval(()=>{
      remaining--; render();
      if(remaining<=0){
        clearInterval(interval); running=false; setBtns(false);
        setStatus('Session complete! Great work. 🎉');
        Toast.show('🍅 Pomodoro done! Take a break.',4000);
      }
    },1000);
  }
  function stop(){
    if(!running) return;
    clearInterval(interval); running=false; setBtns(false);
    setStatus("Paused — resume whenever you're ready.");
  }
  function reset(){
    clearInterval(interval); running=false; remaining=TOTAL;
    setBtns(false); setStatus('Ready to focus'); render();
  }
  render();
  startBtn && startBtn.addEventListener('click',start);
  stopBtn  && stopBtn.addEventListener('click',stop);
  resetBtn && resetBtn.addEventListener('click',reset);
})();

/* ── To-Do List ── */
(()=>{
  let tasks  = Store.get(K.TASKS,[]);
  let filter = 'all';
  const inputEl    = document.getElementById('taskInput');
  const addBtn     = document.getElementById('addTaskBtn');
  const listEl     = document.getElementById('taskList');
  const errorEl    = document.getElementById('taskError');
  const emptyEl    = document.getElementById('taskEmpty');
  const countEl    = document.getElementById('taskCount');
  const clearBtn   = document.getElementById('clearDoneBtn');
  const filterBtns = document.querySelectorAll('.filter-tab');
  const uid=()=>`t_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
  const save=()=>Store.set(K.TASKS,tasks);
  function showErr(msg){ if(errorEl){ errorEl.textContent=msg; if(msg)setTimeout(()=>{ if(errorEl.textContent===msg)errorEl.textContent=''; },3000); } }
  function isDupe(text){ return tasks.some(t=>t.text.toLowerCase()===text.toLowerCase()); }
  function getFiltered(){ if(filter==='active')return tasks.filter(t=>!t.completed); if(filter==='completed')return tasks.filter(t=>t.completed); return tasks; }

  function render(){
    if(!listEl) return;
    const vis=getFiltered(); listEl.innerHTML='';
    if(vis.length===0){ emptyEl&&emptyEl.classList.add('visible'); }
    else { emptyEl&&emptyEl.classList.remove('visible'); vis.forEach(t=>listEl.appendChild(makeEl(t))); }
    if(countEl){
      const rem=tasks.filter(t=>!t.completed).length;
      countEl.textContent=rem>0?`${rem} remaining`:tasks.length>0?'All done! 🎉':'';
    }
  }

  function makeEl(task){
    const li=document.createElement('li');
    li.className='task-item'+(task.completed?' completed':'');
    li.dataset.id=task.id;

    const chk=document.createElement('input');
    chk.type='checkbox'; chk.className='task-item__check'; chk.checked=task.completed;
    chk.setAttribute('aria-label',`Toggle "${task.text}"`);
    chk.addEventListener('change',()=>{ task.completed=!task.completed; save(); render(); });

    const txt=document.createElement('span');
    txt.className='task-item__text'; txt.textContent=task.text; txt.title=task.text;

    const acts=document.createElement('div');
    acts.className='task-item__actions';

    const editBtn=document.createElement('button');
    editBtn.className='task-item__btn'; editBtn.innerHTML='✏️'; editBtn.title='Edit';
    editBtn.addEventListener('click',()=>startEdit(li,task,txt,editBtn));

    const delBtn=document.createElement('button');
    delBtn.className='task-item__btn task-item__btn--delete'; delBtn.innerHTML='🗑'; delBtn.title='Delete';
    delBtn.addEventListener('click',()=>{
      li.classList.add('removing');
      setTimeout(()=>{ tasks=tasks.filter(t=>t.id!==task.id); save(); render(); },320);
    });

    acts.appendChild(editBtn); acts.appendChild(delBtn);
    li.appendChild(chk); li.appendChild(txt); li.appendChild(acts);
    return li;
  }

  function startEdit(li, task, txtSpan, editBtn){
    const inp=document.createElement('input');
    inp.type='text'; inp.className='task-item__edit-input';
    inp.value=task.text; inp.maxLength=120;
    txtSpan.replaceWith(inp); inp.focus(); inp.select();

    const saveBtn=document.createElement('button');
    saveBtn.className='task-item__btn'; saveBtn.innerHTML='💾'; saveBtn.title='Save';
    editBtn.replaceWith(saveBtn);

    function commit(){
      const v=inp.value.trim();
      if(!v){ Toast.show('Task cannot be empty'); inp.focus(); return; }
      if(v.toLowerCase()!==task.text.toLowerCase()&&isDupe(v)){ Toast.show('Duplicate task!'); inp.focus(); return; }
      const idx=tasks.findIndex(t=>t.id===task.id);
      if(idx!==-1) tasks[idx].text=v;
      save(); render();
    }
    saveBtn.addEventListener('click',commit);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter')commit(); if(e.key==='Escape')render(); });
    inp.addEventListener('blur',()=>setTimeout(()=>{ if(document.activeElement!==saveBtn)render(); },150));
  }

  function addTask(){
    const text=inputEl?inputEl.value.trim():'';
    if(!text){ showErr('Please enter a task.'); inputEl&&inputEl.focus(); return; }
    if(isDupe(text)){ showErr(`"${text}" is already in your list.`); inputEl&&inputEl.focus(); return; }
    showErr('');
    tasks.unshift({id:uid(),text,completed:false,createdAt:Date.now()});
    save(); render();
    if(inputEl) inputEl.value='';
    inputEl&&inputEl.focus();
    Toast.show('Task added ✓');
  }

  // Filter tabs
  filterBtns.forEach(btn=>{
    btn.addEventListener('click',()=>{
      filter=btn.dataset.filter;
      filterBtns.forEach(b=>{ b.classList.toggle('active',b===btn); });
      render();
    });
  });

  clearBtn&&clearBtn.addEventListener('click',()=>{
    const n=tasks.filter(t=>t.completed).length;
    if(!n){ Toast.show('No completed tasks'); return; }
    tasks=tasks.filter(t=>!t.completed); save(); render();
    Toast.show(`Cleared ${n} task${n!==1?'s':''}`);
  });

  addBtn  && addBtn.addEventListener('click',addTask);
  inputEl && inputEl.addEventListener('keydown',e=>{ if(e.key==='Enter')addTask(); });

  render();
})();

/* ── Quick Links ── */
(()=>{
  let links=Store.get(K.LINKS,[]);
  const form    = document.getElementById('addLinkForm');
  const nameEl  = document.getElementById('linkName');
  const urlEl   = document.getElementById('linkUrl');
  const gridEl  = document.getElementById('linksGrid');
  const errorEl = document.getElementById('linkError');
  const emptyEl = document.getElementById('linksEmpty');
  const uid=()=>`l_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
  const save=()=>Store.set(K.LINKS,links);
  function showErr(msg){ if(errorEl){ errorEl.textContent=msg; if(msg)setTimeout(()=>{ if(errorEl.textContent===msg)errorEl.textContent=''; },3500); } }
  function normalise(u){ u=u.trim(); if(!/^https?:\/\//i.test(u)) u='https://'+u; return u; }
  function validUrl(u){ try{ new URL(u); return true; }catch{ return false; } }
  function favicon(u){ try{ return `https://www.google.com/s2/favicons?domain=${new URL(u).origin}&sz=32`; }catch{ return ''; } }

  function render(){
    if(!gridEl) return; gridEl.innerHTML='';
    if(links.length===0){ emptyEl&&emptyEl.classList.add('visible'); return; }
    emptyEl&&emptyEl.classList.remove('visible');
    links.forEach(link=>{
      const chip=document.createElement('a');
      chip.className='link-chip';
      chip.href=link.url; chip.target='_blank'; chip.rel='noopener noreferrer';
      chip.setAttribute('aria-label',`Open ${link.name}`);

      const img=document.createElement('img');
      img.className='link-chip__favicon'; img.src=favicon(link.url);
      img.alt=''; img.width=16; img.height=16;
      img.onerror=()=>img.style.display='none';

      const lbl=document.createElement('span'); lbl.textContent=link.name;

      const del=document.createElement('button');
      del.className='link-chip__delete'; del.innerHTML='✕';
      del.title=`Remove ${link.name}`; del.setAttribute('aria-label',`Remove ${link.name}`);
      del.addEventListener('click',e=>{
        e.preventDefault(); e.stopPropagation();
        chip.style.transition='opacity 0.2s,transform 0.2s';
        chip.style.opacity='0'; chip.style.transform='scale(0.85)';
        setTimeout(()=>{ links=links.filter(l=>l.id!==link.id); save(); render(); },220);
      });

      chip.appendChild(img); chip.appendChild(lbl); chip.appendChild(del);
      gridEl.appendChild(chip);
    });
  }

  form&&form.addEventListener('submit',e=>{
    e.preventDefault();
    const name=nameEl?nameEl.value.trim():'';
    const raw =urlEl ?urlEl.value.trim() :'';
    if(!name){ showErr('Please enter a link name.'); nameEl&&nameEl.focus(); return; }
    if(!raw) { showErr('Please enter a URL.'); urlEl&&urlEl.focus(); return; }
    const url=normalise(raw);
    if(!validUrl(url)){ showErr('Please enter a valid URL.'); urlEl&&urlEl.focus(); return; }
    showErr('');
    links.push({id:uid(),name,url}); save(); render();
    if(nameEl) nameEl.value=''; if(urlEl) urlEl.value='';
    nameEl&&nameEl.focus();
    Toast.show(`${name} added 🔗`);
  });

  render();
})();
</script>
